name: Daily OKEI Update

on:
  schedule:
    - cron: '0 13 * * *'      # 13:00 UTC = 16:00 МСК (разнесено с ОКПД2/ОКВЭД2/ОКТМО)
  workflow_dispatch:          # ручной запуск

jobs:
  sync-and-trigger:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      # Kaggle CLI >= 1.8.0 читает KAGGLE_API_TOKEN напрямую.
      # В репозитории секрет называется KAGGLE_API_TOKEN_OKEI, внутри — чистый токен.
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN_OKEI }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Kaggle CLI (>= 1.8.0)
        run: |
          pip install -q --upgrade kaggle
          kaggle --version
          python - <<'EOF'
          import re, subprocess
          out = subprocess.check_output(["kaggle", "--version"], text=True).strip()
          m = re.search(r"(\d+)\.(\d+)", out)
          assert m and tuple(map(int, m.groups())) >= (1, 8), \
              f"нужен kaggle CLI >= 1.8.0 для API-токенов, получен: {out}"
          print("OK: kaggle CLI >= 1.8.0")
          EOF

      - name: Download latest kernel output
        run: |
          mkdir -p ./output
          kaggle kernels output eavprog/okei-classifier-downloader -p ./output
          echo "Содержимое output:"
          find ./output -maxdepth 4 -type f | head -40
          echo ""
          echo "--- диагностика логов тетрадки (если есть) ---"
          for f in ./output/*.log ./output/*.txt; do
            [ -f "$f" ] && { echo ">>> $f (last 50 lines) >>>"; tail -n 50 "$f"; echo "<<< $f <<<"; echo ""; }
          done || true

      - name: Detect SRC and copy web files
        id: copy
        run: |
          # Авто-детект: okei_data/web (стандарт v-next) → web (фоллбэк).
          # Голый ./output запрещён (§11 стандарта).
          SRC=""
          for cand in "./output/okei_data/web" "./output/web"; do
            if [ -f "$cand/okei.json" ]; then
              SRC="$cand"
              break
            fi
          done
          if [ -z "$SRC" ]; then
            echo "::warning::okei.json не найден ни в ./output/okei_data/web, ни в ./output/web"
            echo "FILES_OK=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "SRC=$SRC"
          MISSING=0
          for f in okei.json okei.json.gz okei_meta.json okei_meta.json.gz; do
            if [ -f "$SRC/$f" ]; then
              cp "$SRC/$f" "./$f"
              echo "copied $f"
            else
              echo "::warning::MISSING $f в $SRC (тетрадка, вероятно, упала)"
              MISSING=$((MISSING+1))
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "❌ Отсутствует $MISSING из 4 файлов — коммит пропущен"
            echo "FILES_OK=false" >> "$GITHUB_ENV"
          else
            echo "✅ Все 4 файла на месте"
            echo "FILES_OK=true" >> "$GITHUB_ENV"
          fi

      - name: Check metadata
        id: meta
        if: env.FILES_OK == 'true'
        run: |
          python - <<'EOF'
          import json, hashlib, os, re

          with open("okei_meta.json", "r", encoding="utf-8") as f:
              m = json.load(f)

          ok = True
          reasons = []

          # 1. publish_allowed
          if m.get("publish_allowed") is not True:
              ok = False
              reasons.append(f"publish_allowed={m.get('publish_allowed')}")

          # 2. critical_errors
          ce = m.get("critical_errors")
          if ce:
              ok = False
              reasons.append(f"critical_errors={ce}")

          # 3. Сверка data_hash_full с фактическим sha256 okei.json
          with open("okei.json", "rb") as f:
              actual_full = hashlib.sha256(f.read()).hexdigest()
          declared_full = m.get("data_hash_full")
          if not declared_full:
              reasons.append("data_hash_full отсутствует в мете (warning, не блокирует)")
          elif not re.fullmatch(r"[0-9a-f]{64}", str(declared_full)):
              ok = False
              reasons.append(f"data_hash_full невалидный: {declared_full}")
          elif declared_full != actual_full:
              ok = False
              reasons.append(
                  f"data_hash_full mismatch: meta={declared_full[:16]}… actual={actual_full[:16]}…"
              )

          # 4. Сверка data_hash (16) с префиксом sha256
          declared_short = m.get("data_hash")
          if declared_short and declared_short != actual_full[:16]:
              ok = False
              reasons.append(
                  f"data_hash mismatch: meta={declared_short} actual={actual_full[:16]}"
              )

          if ok:
              print("✓ Мета OK: publish_allowed=true, critical_errors=[], data_hash_full совпадает")
              for r in reasons:
                  print(f"  ⚠ {r}")
              with open(os.environ["GITHUB_ENV"], "a") as env:
                  env.write("META_OK=true\n")
          else:
              print("::error::Мета не прошла проверку:")
              for r in reasons:
                  print(f"  - {r}")
              with open(os.environ["GITHUB_ENV"], "a") as env:
                  env.write("META_OK=false\n")
          EOF

      - name: Commit and push changes
        if: env.FILES_OK == 'true' && env.META_OK == 'true'
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "GitHub Actions"
          git add okei.json okei.json.gz okei_meta.json okei_meta.json.gz
          if git diff --cached --quiet; then
            echo "✅ Изменений нет — данные уже актуальны"
          else
            SOURCE_DATE=$(python -c 'import json;m=json.load(open("okei_meta.json"));print(m.get("source_date") or m.get("effective_date") or m.get("prepared_date") or m.get("generated_at") or "?")')
            git commit -m "chore(data): auto-update OKEI ${SOURCE_DATE}"
            git push
            echo "✅ Изменения запушены (source=${SOURCE_DATE})"
          fi

      - name: Trigger new notebook run (fire-and-forget, всегда)
        if: always()
        run: |
          mkdir -p ./nb
          kaggle kernels pull eavprog/okei-classifier-downloader -p ./nb --metadata
          kaggle kernels push -p ./nb
          echo "✅ Тетрадка перезапущена (round-trip); workflow не ждёт её завершения"